name: OPR review tests (no deploy)

on:
  pull_request:
    branches: [main]
    paths:
      - 'operational-priority-radar/**'
      - '.github/workflows/opr-review-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: operational-priority-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Unittest (full OPR directory)
        run: python -m unittest discover -v
      - name: Pytest (full OPR directory)
        run: pytest -q

# No secrets, Render deploy, push or merge permissions.
