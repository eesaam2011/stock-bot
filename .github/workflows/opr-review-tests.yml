name: OPR review tests (no deploy)

on:
  pull_request:
    branches: [main]
    paths:
      - 'operational-priority-radar/**'
      - '.github/workflows/opr-review-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      OPR_REDIS_TEST_URL: redis://127.0.0.1:6379/15
      OPR_REQUIRE_REAL_REDIS: '1'
    defaults:
      run:
        working-directory: operational-priority-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Mandatory real Redis 7 Lua integration tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v test_step2n_real_redis 2>&1 | tee "$GITHUB_WORKSPACE/redis-real-output.txt"
      - name: Verify real Redis 7 integration service
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,redis
          url=os.environ["OPR_REDIS_TEST_URL"]
          assert url=="redis://127.0.0.1:6379/15", "unexpected Redis test URL"
          client=redis.Redis.from_url(url,decode_responses=True,socket_timeout=2)
          assert client.ping(), "Redis integration service unreachable"
          print("REAL_REDIS_7_PING_OK")
          PY
          python -m unittest -v test_step2n_real_redis 2>&1 | tee "$GITHUB_WORKSPACE/redis-integration-output.txt"
          grep -q "Ran 6 tests" "$GITHUB_WORKSPACE/redis-integration-output.txt"
          grep -q "^OK$" "$GITHUB_WORKSPACE/redis-integration-output.txt"
          printf 'real_redis_integration=passed\\n' > "$GITHUB_WORKSPACE/redis-integration-ok.txt"
      - name: Unittest (full OPR directory)
        run: python -m unittest discover -v
      - name: Pytest (full OPR directory; export exact stdout)
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee "$GITHUB_WORKSPACE/pytest-q-output.txt"
      - name: Package reviewed source and exact pytest output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/opr-review-package"
          mkdir -p "$pkg"
          git -C "$GITHUB_WORKSPACE" archive --format=tar HEAD operational-priority-radar .github/workflows/opr-review-tests.yml | tar -x -C "$pkg"
          if test -f "$GITHUB_WORKSPACE/redis-real-output.txt"; then
            cp "$GITHUB_WORKSPACE/redis-real-output.txt" "$pkg/redis-real-output.txt"
          else
            printf 'Mandatory Redis integration step did not run; inspect CI logs.\n' > "$pkg/redis-real-output.txt"
          fi
          if test -f "$GITHUB_WORKSPACE/pytest-q-output.txt"; then
            cp "$GITHUB_WORKSPACE/pytest-q-output.txt" "$pkg/pytest-q-output.txt"
          else
            printf 'pytest -q did not run; see workflow job logs.\n' > "$pkg/pytest-q-output.txt"
          fi
          {
            printf 'review_only=true\n'
            printf 'tested_git_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'github_run=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'pytest_command=pytest -q\n'
            printf 'real_redis_required=true\n'
            printf 'redis_test_url=redis://127.0.0.1:6379/15\n'
            printf 'render_deployed=false\n'
            printf 'canonical_replay_completed=false\n'
            printf 'sip_continuity_proven=false\n'
            printf 'rest_sip_overlap_audit=read_only\n'
            printf 'integrated_eb_sip_preview=read_only\n'
            printf 'sip_prefix_snapshot=atomic_copy_no_ack\n'
            printf 'canonical_eb_replay=not_implemented\n'
            printf 'rest_pagination_audit=bounded_native_1m_5m\n'
            printf 'full_session_coverage_proven=false\n'
            if test -f "$GITHUB_WORKSPACE/redis-integration-ok.txt"; then
              printf 'real_redis_integration=passed\n'
            else
              printf 'real_redis_integration=not_verified\n'
            fi
          } > "$pkg/REVIEW_MANIFEST.txt"
          if test -f "$GITHUB_WORKSPACE/redis-integration-output.txt"; then
            cp "$GITHUB_WORKSPACE/redis-integration-output.txt" "$pkg/redis-integration-output.txt"
          fi
          (cd "$pkg" && zip -qr "$GITHUB_WORKSPACE/opr-review-package.zip" .)
      - name: Upload review package and pytest text evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opr-step3a-review-bundle
          path: |
            opr-review-package.zip
            pytest-q-output.txt
            redis-integration-output.txt
            redis-real-output.txt
          if-no-files-found: error
          retention-days: 30

# No secrets, Render deploy, push or merge permissions.
