name: EHR G5 isolated collector tests
on:
  pull_request:
    paths:
      - 'ndr_backtest/ehr_g5_isolated_collector.py'
      - 'ndr_backtest/test_ehr_g5_isolated_collector.py'
      - '.github/workflows/ehr-g5-tests.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated offline tests (no Alpaca keys)
        run: python -m unittest discover -s ndr_backtest -p 'test_ehr_g5_isolated_collector.py' -v
