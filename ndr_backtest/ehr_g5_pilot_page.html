<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EHR G5 — تجربة الأسعار</title><style>body{font-family:system-ui;max-width:640px;margin:3em auto;padding:1em;background:#f8fafc;color:#172554}section{background:white;padding:1.2em;border-radius:12px;box-shadow:0 2px 8px #ddd}button,input{font:inherit;padding:.7em;margin:.5em 0;width:100%;box-sizing:border-box}button{background:#14532d;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e2e8f0;padding:1em;border-radius:8px}</style><section><h1>EHR G5 — تجربة ثلاثة أسهم</h1><p>تعمل بعد 5:30 مساءً بتوقيت نيويورك فقط. لا تغيّر الباك تيست ولا تحسب الأرباح. الملف والرمز الإداري لا يُرسلان إلى GitHub.</p><label>الرمز الإداري<input id="token" type="password" autocomplete="off"></label><label>ملف المتطلبات التاريخية JSON<input id="file" type="file" accept=".json,application/json"></label><button onclick="upload()">1 — رفع الملف والتحقق</button><button onclick="start()">2 — بدء تجربة الأسهم الثلاثة</button><button onclick="status()">3 — عرض الحالة</button><button onclick="download()">4 — تحميل النتائج ZIP</button><pre id="result">بانتظار البدء</pre></section><script>const result=document.getElementById('result');function headers(){return {'X-Admin-Token':document.getElementById('token').value}}async function show(r){let t=await r.text();try{result.textContent=JSON.stringify(JSON.parse(t),null,2)}catch(e){result.textContent=t}if(!r.ok)result.textContent='HTTP '+r.status+'\n'+result.textContent}async function upload(){let f=document.getElementById('file').files[0];if(!f){result.textContent='اختر ملف JSON أولاً';return}await show(await fetch('/ehr-g5/requirements',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:await f.text()}))}async function start(){await show(await fetch('/ehr-g5/start',{method:'POST',headers:headers()}))}async function status(){await show(await fetch('/ehr-g5/status',{headers:headers()}))}async function download(){let r=await fetch('/ehr-g5/download',{headers:headers()});if(!r.ok){await show(r);return}let a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='ehr_g5_pilot_sip.zip';a.click();URL.revokeObjectURL(a.href);result.textContent='تم تجهيز ملف ZIP'}</script></html>
